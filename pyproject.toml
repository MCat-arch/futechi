[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futechi-graphrag"
version = "0.1.0"
description = "Poultry GraphRAG-Vet system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "neo4j>=5.24,<6.0",
    "langgraph>=0.2,<0.7",       # pin upper bound since it's pre-1.0
    "langchain-core>=0.3,<0.4",
    "openai>=1.50,<2.0",          # deliberately exclude v2 until you test the migration
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]