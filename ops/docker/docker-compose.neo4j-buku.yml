# Neo4j KEDUA khusus data buku (seed 004), terpisah total dari graph utama
# (poultry-neo4j di docker-compose.neo4j.yml): nama project, container, volume,
# dan port semuanya berbeda.
#
# Jalankan dari ROOT repo (supaya NEO4J_BUKU_* dibaca dari .env root):
#   docker compose --env-file .env -f ops/docker/docker-compose.neo4j-buku.yml up -d
#
# Browser : http://localhost:7475   (Connect URL: neo4j://localhost:7688)
# Bolt    : bolt://localhost:7688
name: poultry-buku

services:
  neo4j-buku:
    image: neo4j:5.26-community
    container_name: poultry-neo4j-buku
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      # Username awal Neo4j wajib "neo4j". Password hanya dipakai saat volume
      # masih kosong (pertama kali container dibuat).
      NEO4J_AUTH: neo4j/${NEO4J_BUKU_PASSWORD:?isi NEO4J_BUKU_PASSWORD di .env root}
      # Port di host berbeda dari port di dalam container, jadi Browser perlu
      # tahu alamat yang benar.
      NEO4J_server_bolt_advertised__address: localhost:7688
      NEO4J_server_http_advertised__address: localhost:7475
    volumes:
      - neo4j_buku_data:/data
      - neo4j_buku_logs:/logs

volumes:
  neo4j_buku_data:
  neo4j_buku_logs:
