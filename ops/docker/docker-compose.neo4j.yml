services:
  neo4j:
    image: neo4j:5.26-community
    container_name: poultry-neo4j
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt driver port
    environment:
      # Keep the first dev setup simple: one local user/password pair.
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me}

      # APOC is the main plugin we need for graph utility functions and Cypher helpers.
      NEO4J_PLUGINS: '["apoc"]'

      # Allow file import/export only if you later need local CSV loading.
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
      NEO4J_server_directories_import: /var/lib/neo4j/import
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

