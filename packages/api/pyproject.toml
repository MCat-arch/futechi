[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futechi-api"
version = "0.1.0"
description = "FastAPI backend untuk Futechi Poultry GraphRAG-Vet"
requires-python = ">=3.11"
dependencies = [
    # pipeline dipasang terpisah sebagai editable:
    #   pip install -e packages/pipeline
    "futechi-graphrag",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "pillow>=10.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
