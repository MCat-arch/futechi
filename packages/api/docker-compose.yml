services:
  postgres:
    image: postgres:16-alpine
    container_name: futechi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-futechi}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: futechi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Neo4j knowledge graph. Container ini SAMA dengan yang dipakai pipeline
  # (ops/docker/docker-compose.neo4j.yml) -- jalankan salah satu saja, jangan
  # keduanya, karena port 7687 akan bentrok.
  neo4j:
    image: neo4j:5.26-community
    container_name: poultry-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
