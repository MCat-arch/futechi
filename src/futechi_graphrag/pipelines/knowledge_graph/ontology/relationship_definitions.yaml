# Definisi relationship type. specificity/onset_stage/mechanism/clinical_note
# di HAS_VISUAL_FEATURE dan HAS_SYMPTOM adalah bahan multi-hop differential
# reasoning -- pengganti scoring numerik yang sengaja tidak dipakai di sistem ini.
#
# Aturan pengisian specificity pada seed (supaya konsisten & bisa diaudit):
#   high   = sumber menyebut tanda ini khas/nyata DAN jarang dimiliki kandidat lain di katalog
#   medium = sumber menyebut "sesuai", tetapi tanda juga dimiliki kandidat lain / punya penyebab lain
#   low    = sumber menyebut "tidak spesifik", "tidak patognomonik", "tidak khas", "kadang",
#            "bukan tanda utama", atau tanda dimiliki >= 3 kandidat di katalog

HAS_VISUAL_FEATURE:
  from: Disease
  to: VisualFeature
  properties:
    specificity:
      type: enum
      values: [high, medium, low]
      required: true
      description: Seberapa khas fitur ini untuk penyakit tsb (vs penyakit lain).
    onset_stage:
      type: enum
      values: [early, middle, late]
      required: false
      description: >
        Tahap penyakit saat fitur ini biasanya muncul. BOLEH kosong jika
        sumber tidak menyebutkannya -- severity lalu memakai multiplier 1.0
        (lihat compute_severity). Jangan diisi tebakan.
    mechanism:
      type: string
      required: false
      description: Penjelasan patofisiologi singkat, dipakai LLM utk reasoning naratif.
    clinical_note:
      type: string
      required: false
      description: Catatan validasi spesifik tanda ini untuk penyakit ini (mis. "tidak patognomonik").

HAS_SYMPTOM:
  from: Disease
  to: Symptom
  properties:
    specificity:
      type: enum
      values: [high, medium, low]
      required: true
    onset_stage:
      type: enum
      values: [early, middle, late]
      required: false
    mechanism:
      type: string
      required: false
    clinical_note:
      type: string
      required: false

ASSOCIATED_WITH_ENVIRONMENT:
  from: Disease
  to: EnvironmentalCondition
  properties:
    strength:
      type: enum
      values: [high, medium, low]
      required: true
      description: Seberapa kuat kondisi lingkungan ini berkontribusi terhadap penyakit.
    note:
      type: string
      required: false
    data_status:
      type: enum
      values: [draft_literature, draft_general_knowledge, vet_validated]
      required: true

REQUIRES_INSPECTION:
  from: Disease
  to: InspectionAction
  properties: {}

MITIGATED_BY:
  from: Disease
  to: MitigationAction
  properties: {}

TREATED_WITH:
  from: Disease
  to: MedicalTreatment
  properties:
    dosage:
      type: string
      required: true
      description: >
        Dosis spesifik untuk kombinasi Disease-MedicalTreatment ini --
        BOLEH beda dari MedicalTreatment.dosage default kalau ada
        penyesuaian per-penyakit (mis. durasi terapi beda).
    withdrawal_period:
      type: string
      required: true
